name: Apply SEO updates

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply SEO changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          html = index.read_text()
          marker = '<!-- PEKES SEO HOME -->'
          seo = '''  <!-- PEKES SEO HOME -->
            <link rel="canonical" href="https://pekes.shop/" />
            <meta name="robots" content="index, follow, max-image-preview:large" />
            <meta property="og:type" content="website" />
            <meta property="og:site_name" content="PEKES" />
            <meta property="og:title" content="PEKES | Gimnasios y rascadores para gatos en Cali" />
            <meta property="og:description" content="Gimnasios para gatos, rascadores y muebles felinos hechos por encargo en Cali." />
            <meta property="og:url" content="https://pekes.shop/" />
            <meta property="og:image" content="https://pekes.shop/images/logos/logo_morado.png" />
            <meta name="twitter:card" content="summary_large_image" />
            <meta name="twitter:title" content="PEKES | Gimnasios y rascadores para gatos en Cali" />
            <meta name="twitter:description" content="Gimnasios para gatos, rascadores y muebles felinos hechos por encargo en Cali." />
            <meta name="twitter:image" content="https://pekes.shop/images/logos/logo_morado.png" />
            <script type="application/ld+json" data-seo="website">{"@context":"https://schema.org","@type":"WebSite","name":"PEKES","url":"https://pekes.shop/","description":"Gimnasios para gatos, rascadores y muebles felinos hechos por encargo en Cali."}</script>
'''
          if marker not in html:
              html = html.replace('</head>', seo + '  </head>', 1)
              index.write_text(html)
          app_path = Path('src/js/app.js')
          app = app_path.read_text()
          marker2 = '// SEO dinámico para fichas de producto compartibles'
          block = '''// SEO dinámico para fichas de producto compartibles
function updateProductSeo(product) {
  const titleEl = document.querySelector('title');
  const descEl = document.querySelector('meta[name="description"]');
  const canonical = document.querySelector('link[rel="canonical"]');
  const productTitle = product.name + ' | Gimnasio para gatos | PEKES';
  const productDescription = product.description + ' Disponible por encargo en Cali. Consulta precio y entrega con PEKES.';
  const productUrl = 'https://pekes.shop/#producto-' + product.id;
  if (titleEl) titleEl.textContent = productTitle;
  if (descEl) descEl.setAttribute('content', productDescription);
  if (canonical) canonical.setAttribute('href', productUrl);
  let schema = document.getElementById('product-seo-schema');
  if (!schema) { schema = document.createElement('script'); schema.type = 'application/ld+json'; schema.id = 'product-seo-schema'; document.head.appendChild(schema); }
  schema.textContent = JSON.stringify({'@context':'https://schema.org','@type':'Product',name:product.name,sku:product.sku,description:product.description,image:'https://pekes.shop'+product.image,category:product.category,offers:{'@type':'Offer',priceCurrency:'COP',price:String(product.price),availability:'https://schema.org/PreOrder',url:productUrl}});
}
function resetHomeSeo() {
  document.querySelector('title').textContent = 'PEKES | Gimnasios y rascadores para gatos en Cali';
  document.querySelector('meta[name="description"]').setAttribute('content', 'Gimnasios para gatos, rascadores y muebles felinos hechos por encargo en Cali.');
  document.querySelector('link[rel="canonical"]').setAttribute('href', 'https://pekes.shop/');
  document.getElementById('product-seo-schema')?.remove();
}

'''
          if marker2 not in app:
              app = app.replace('// Modal Logic', block + '// Modal Logic', 1)
              app = app.replace('  state.selectedProduct = product;\n', '  state.selectedProduct = product;\n  updateProductSeo(product);\n', 1)
              app = app.replace("  document.body.style.overflow = '';\n}\n\n// Legal Modal", "  document.body.style.overflow = '';\n  resetHomeSeo();\n}\n\n// Legal Modal", 1)
              app_path.write_text(app)
          PY
      - name: Commit SEO files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/js/app.js
          git diff --cached --quiet || (git commit -m "Completar SEO de inicio y fichas de producto" && git push)
