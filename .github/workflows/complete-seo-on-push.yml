name: Complete SEO on push
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch SEO
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          if '<!-- PEKES SEO HOME -->' not in s:
            x='''  <!-- PEKES SEO HOME -->\n  <link rel="canonical" href="https://pekes.shop/" />\n  <meta name="robots" content="index, follow, max-image-preview:large" />\n  <meta property="og:type" content="website" />\n  <meta property="og:site_name" content="PEKES" />\n  <meta property="og:title" content="PEKES | Gimnasios y rascadores para gatos en Cali" />\n  <meta property="og:description" content="Gimnasios para gatos, rascadores y muebles felinos hechos por encargo en Cali." />\n  <meta property="og:url" content="https://pekes.shop/" />\n  <meta property="og:image" content="https://pekes.shop/images/logos/logo_morado.png" />\n  <meta name="twitter:card" content="summary_large_image" />\n  <script type="application/ld+json" data-seo="website">{"@context":"https://schema.org","@type":"WebSite","name":"PEKES","url":"https://pekes.shop/"}</script>\n'''
            p.write_text(s.replace('</head>',x+'</head>',1))
          p=Path('src/js/app.js'); s=p.read_text()
          if '// SEO dinámico para fichas de producto compartibles' not in s:
            b='''// SEO dinámico para fichas de producto compartibles\nfunction updateProductSeo(product){const t=document.querySelector('title'),d=document.querySelector('meta[name="description"]'),c=document.querySelector('link[rel="canonical"]');const u='https://pekes.shop/#producto-'+product.id;if(t)t.textContent=product.name+' | Gimnasio para gatos | PEKES';if(d)d.setAttribute('content',product.description+' Disponible por encargo en Cali.');if(c)c.setAttribute('href',u);let z=document.getElementById('product-seo-schema');if(!z){z=document.createElement('script');z.type='application/ld+json';z.id='product-seo-schema';document.head.appendChild(z)}z.textContent=JSON.stringify({'@context':'https://schema.org','@type':'Product',name:product.name,sku:product.sku,description:product.description,image:'https://pekes.shop'+product.image,offers:{'@type':'Offer',priceCurrency:'COP',price:String(product.price),url:u}})}\nfunction resetHomeSeo(){document.querySelector('title').textContent='PEKES | Gimnasios y rascadores para gatos en Cali';document.querySelector('link[rel="canonical"]').setAttribute('href','https://pekes.shop/');document.getElementById('product-seo-schema')?.remove()}\n'''
            s=s.replace('// Modal Logic',b+'// Modal Logic',1).replace('  state.selectedProduct = product;\n','  state.selectedProduct = product;\n  updateProductSeo(product);\n',1).replace("  document.body.style.overflow = '';\n}\n\n// Legal Modal","  document.body.style.overflow = '';\n  resetHomeSeo();\n}\n\n// Legal Modal",1)
            p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html src/js/app.js
          git diff --cached --quiet || (git commit -m 'Completar SEO de inicio y fichas de producto' && git push)
